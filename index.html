<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Define el título que aparece en la pestaña del navegador -->
  <title>Polígono con geolocalización</title>

  <!-- Carga los estilos de Leaflet para mostrar correctamente el mapa y sus elementos -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Conecta el archivo de estilos -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!--  Es el encabezado que contiene el título, los controles y los mensajes informativos -->
  <header>
    <!-- Título principal -->
    <h1>Mi polígono</h1>

      <!-- Contenedor general que agrupa los botones y las opciones de configuración -->
      <div class="controles">

        <!-- Botones para controlar el mapa y el polígono -->
        <div class="botones">

          <!-- Solicita la ubicación actual del usuario -->
          <button id="btnUbicar">Mi ubicación</button>

          <!-- Cierra el polígono utilizando los vértices agregados -->
          <button id="btnCerrar">Cerrar polígono</button>

          <!-- Elimina el último vértice agregado -->
          <button id="btnDeshacer">Deshacer punto</button>

          <!-- Limpia los puntos o vértices y el polígono dibujado -->
          <button id="btnLimpiar">Limpiar</button>

          <!-- Exporta el polígono en formato GeoJSON -->
          <button id="btnExportar">Exportar GeoJSON</button>

          <!-- Agrega la ubicación actual como un nuevo vértice -->
          <button id="btnAgregarUbicacion">Agregar vértice aquí</button>

          <!-- Comprueba si la ubicación actual está dentro del polígono -->
          <button id="verificarUbicacion">Verificar si estoy dentro</button>

          <!-- Inicia el seguimiento de la ubicación para comprobar la geocerca -->
          <button id="btnIniciarGeocerca">Iniciar seguimiento</button>

          <!-- Detiene el seguimiento de la ubicación e inicialmente está deshabilitado -->
          <button id="btnDetenerGeocerca" disabled>Detener seguimiento</button>
        </div>

        <!-- Opciones para personalizar el polígono e importar archivos -->
        <div class="opciones">

          <!-- Permite seleccionar el color del polígono -->
          <label class="control-color" for="colorPoligono">Color del polígono
            <input type="color" id="colorPoligono" value="#27ae60">
          </label>

          <!-- Permite introducir el nombre que utilizará el polígono -->
        <label class="control-nombre" for="nombrePoligono">Nombre del polígono
          <input type="text" id="nombrePoligono" placeholder="Ej. Mi terreno" maxlength="60">
        </label>

        <!-- Permite seleccionar un archivo GeoJSON o JSON para importarlo en el mapa -->
        <div class="control-archivo">
          <label for="archivoGeoJSON">Importar GeoJSON</label>
            <input type="file" id="archivoGeoJSON" accept=".geojson,.json,application/geo+json,application/json">
        </div>
      </div>
    </div>

    <!-- Muestra instrucciones y mensajes informativos al usuario -->
    <p id="info">Haz click en el mapa para agregar vértices.</p>
  </header>

  <!-- Reto 1: Tabla de coordenadas -->
  <section>
    <!-- Título de la sección de los vértices del polígono -->
    <h2>Coordenadas de los vértices</h2>

    <!-- Contenedor que permite organizar la tabla mediante CSS -->
    <div class="tabla-contenedor">

      <!-- Tabla para mostrar el número, la latitud y la longitud de cada vértice -->
      <table>
        <!-- Subtítulos de las columnas de la tabla -->
        <thead>
          <tr>
            <th>#</th>
            <th>Latitud</th>
            <th>Longitud</th>
          </tr>
        </thead>

        <!-- Es un contenedor para actualizar las coordenadas de la tabla -->
        <tbody id="tablaCoordenadas">
          <tr>
            <!-- Mensaje que aparece mientras no se hayan agregado vértices -->
            <td colspan="3">Todavía no hay vértices.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Contenedor donde Leaflet mostrará el mapa -->
  <div id="mapa"></div>

  <!-- Carga la biblioteca Leaflet para crear y controlar el mapa -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Carga Turf.js para realizar operaciones geográficas y cálculos espaciales -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

  <!-- Carga el JavaScript del proyecto, que controla los botones y la lógica del mapa -->
  <script src="app.js"></script>
</body>
</html>
