<!DOCTYPE html> 
<html lang="es"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Polígono con geolocalización</title> 
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"> 
  <link rel="stylesheet" href="estilos.css"> 
</head> 
<body> 
  <header> 
    <h1>Mi polígono</h1> 
    <div class="controles"> 
      <button id="btnUbicar">Mi ubicación</button> 
      <button id="btnCerrar" >Cerrar polígono</button> 
      <button id="btnDeshacer">Deshacer punto</button> 
      <button id="btnLimpiar">Limpiar</button> 
      <button id="btnExportar">Exportar GeoJSON</button> 
      
      <!-- Reto 4: Agrega un vértice usando la ubicación actual -->
      <button id="btnAgregarUbicacion">Agregar vértice aquí</button>

      <!-- Reto 2. Opción de escoger el color del polígono -->
      <label for="colorPoligono" class="control-color">  Color del polígono
        <input type="color" id="colorPoligono" value="#27ae60">
      </label>
      
      <label class="control-nombre" for="nombrePoligono">Nombre del polígono
        <input type="text" id="nombrePoligono" placeholder="Ej. Mi terreno" maxlength="60">
      </label>
    </div> 
    <p id="info">Haz clic en el mapa para agregar vértices.</p> 
  </header> 

    <!-- Reto 1: tabla de coordenadas -->
  <section>
    <h2>Coordenadas de los vértices</h2>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Latitud</th>
            <th>Longitud</th>
          </tr>
        </thead>

        <tbody id="tablaCoordenadas">
          <tr>
            <td colspan="3">Todavía no hay vértices.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>


  <div id="mapa"></div> 
 
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> 
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script> 
  <script src="app.js"></script> 
</body> 
</html>
